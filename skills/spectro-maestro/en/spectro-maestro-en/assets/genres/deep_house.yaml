extends: house
name: Deep House
summary: slower, warmer house with jazzy seventh and ninth chords, soft kick and sub bass
bpm: [116, 124, 120]
keys: [C minor, F minor, A minor, D minor]
about: |
  Rhythm: soft round kick, rim or snap on 2 and 4 in place of a hard clap, shaker and off-beat hats, light swing.
  Bass: deep sub or organ bass, sparse, often answering the chords.
  Harmony: minor ninth and major seventh chords on electric piano or pads, held or lightly stabbed; ii-V movement welcome.
  Arrangement: unhurried, long intros and outros, small changes every 8 bars instead of big drops.
  Mix: quieter master than peak-time house, low end round, highs smooth.
