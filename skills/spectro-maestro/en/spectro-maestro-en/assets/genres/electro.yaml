name: Electro
family: retro
summary: 808 electro-funk; syncopated machine beat, robotic bass line, cowbell and vocoder-style hooks
bpm: [118, 135, 128]
keys: [E minor, A minor, D minor, G minor]
about: |
  Rhythm: 808 drums with a broken, syncopated kick (1, the 'a' of 1 or 2, the 'and' of 3), snare or clap on 2
  and 4, sixteenth hats with open-hat accents, cowbell, rim and tom figures. Dry, tight, funky; no swing.
  Bass: a sequenced, robotic line of sixteenths with octave jumps and rests, square or FM bass.
  Harmony: minimal minor; stabs, short string hits, vocoder chords; one or two roots.
  Arrangement: beat alone, bass in, hook in, break with beat only, everything back.
  Mix: drums dry and forward, bass tight, little reverb.
profile:
  master: {lufs: -10}
  roles: {kick: {level: -5.5}, bass: {duck: -3, level: -4}, perc: {level: -11}}
  returns: {reverb: {decay: 1.2}}
song:
  ending: hit
  seed: 171
  chords:
