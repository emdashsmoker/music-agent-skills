extends: house
name: Nu Disco
summary: live-feeling four-on-the-floor with octave bass, strings and funky chords
bpm: [110, 124, 118]
keys: [A minor, D minor, E minor, C major, F major]
about: |
  Rhythm: kick on every beat, snare or clap on 2 and 4, open hat on every off-beat (the disco hat), tambourine or shaker.
  Bass: octave-jumping eighths or a syncopated funk line; it is melodic and prominent.
  Harmony: seventh chords in 4-bar turnarounds (ii7 V7 Imaj7 VI7, i7 IV7), string lines and stabs, electric piano.
  Arrangement: verse and chorus contrast like a pop song; breakdown strips to bass and strings.
  Mix: warm, less sub than house, moderate loudness, plate reverb on snare and strings.
