name: Doomer (post-punk / coldwave)
family: retro
summary: cold Eastern-bloc post-punk; drum machine, driving melodic bass, chorus guitar, icy synth, deadpan baritone
bpm: [140, 170, 156]
keys: [E minor, A minor, D minor, B minor, F# minor]
about: |
  Rhythm: a plain drum machine. Kick on 1 and 3 (often with an extra eighth), snare on 2 and 4, relentless closed
  hats in eighths; no swing, no fills beyond a snare flam or a tom at section ends. The tempo is fast but the
  mood is resigned.
  Bass: the lead instrument. A picked bass guitar plays constant eighths that outline the chord and add a
  melodic turn at the end of each bar (root root root fifth, walking up to the next root). Slightly overdriven.
  Guitar: clean with heavy chorus, playing arpeggiated triads or a two-note hook high on the neck.
  Synth: one cold pad or string-machine line holding the chord, and a simple monophonic lead (saw or square)
  that states a short, sad theme between vocal lines.
  Harmony: natural minor, three or four chords, one per bar or per two bars: i VI III VII, i iv VI V, i VII VI VI.
  Vocal: low, flat, close to speech, heavy plate reverb; the lyrics are bleak and plain. Little or no vibrato.
  Arrangement: intro with the bass riff and drums, verse, chorus (synth lead joins), verse, chorus,
  instrumental bridge, final chorus, abrupt or faded end. 3-4 minutes.
  Mix: lo-fi on purpose: narrow, mid-heavy, rolled-off highs, tape wobble; bass and vocal in front, drums dry
  and boxy, long reverb on voice, guitar and snare. Quiet master with dynamics left in.
