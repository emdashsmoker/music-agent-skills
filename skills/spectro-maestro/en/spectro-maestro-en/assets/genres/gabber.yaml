name: Gabber
family: hardcore
summary: 170-190 bpm hardcore; a hugely distorted kick on every beat, hoover stabs and screeching leads
bpm: [160, 200, 180]
keys: [F minor, E minor, G minor, A minor]
about: |
  Rhythm: the distorted kick is everything: on every beat, long enough to carry pitch, sometimes re-pitched to
  play a bass line or doubled into rolls before a change. Off-beat open hat, clap or snare on 2 and 4, ride
  in the peak. Fills are kick rolls (eighths to sixteenths to thirty-seconds).
  Bass: none beside the kick's tail.
  Harmony: minor rave stabs (the hoover), simple scary riffs of 3-5 notes, sirens; often a single root with a
  flat second or tritone. Melodic hardcore uses supersaw anthems over the same kick.
  Arrangement: intro with stabs or a spoken sample, kick drop, 16-bar blocks with a new lead each time, short
  breaks without kick, kick roll back in.
  Mix: the kick takes most of the headroom on purpose and is clipped, not limited; leads are loud, harsh and
  mid-heavy; no sidechain subtlety, everything else simply stops when the kick hits.
