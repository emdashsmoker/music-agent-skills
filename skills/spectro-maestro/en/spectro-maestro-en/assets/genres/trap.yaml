name: Trap
family: hiphop
summary: half-time 808 kick and sliding sub bass, clap on 3, rolling hi-hats, dark minor melody
bpm: [130, 160, 140]
keys: [C minor, D minor, F minor, G minor, A minor]
about: |
  Rhythm: half-time feel. Clap or snare on beat 3; kicks syncopated and tied to the 808 notes; closed hats in
  eighths or sixteenths with rolls (32nds and triplets, written r and t) and velocity ramps; open hat accents.
  Bass: long, tuned 808 notes that follow the kick; slides between notes (~); it is both bass and kick tail.
  Harmony: dark minor, two or four chords, often just root and flat sixth or flat second; bells, plucks, flutes
  and pads play a short repeating motif.
  Arrangement: intro with the melody, verse (hook out or thinned), hook with everything, 8-bar switches.
  Mix: 808 and kick share the low end (kick short, 808 long, no sidechain pump on the 808 or a very light one);
  hats crisp but not loud; lots of space for a vocal.
profile:
  master: {lufs: -9.5}
  roles:
    kick: {level: -4}
    bass: {duck: -2, level: -1.5, hpf: 25}
    hat: {level: -13}
  returns: {reverb: {decay: 2.4}}
