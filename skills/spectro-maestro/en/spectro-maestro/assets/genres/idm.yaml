  roles:
    kick: {level: -5}
    snare: {level: -6}
    hat: {level: -14}
    perc: {level: -11}
    pad: {duck: 0, reverb: 0.4, level: -5}
    pluck: {duck: 0, reverb: 0.35, delay: 0.3, level: -3}
    bass: {duck: -2}
  returns: {reverb: {decay: 3.5}, delay: {time: 1/8d, feedback: 0.45}}
