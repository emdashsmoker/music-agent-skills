name: IDM
family: experimental
summary: intricate, irregular drum programming with glitches and rolls under warm melodic pads, bells and odd harmony
bpm: [85, 170, 140]
keys: [D dorian, A minor, F lydian, E minor, C major]
about: |
  Rhythm: the opposite of a loop. Kicks and snares fall in unexpected places, fast rolls and retriggers (r, t),
  ghost notes, bars that differ from each other; patterns of 2 or 4 bars written out in full. Half-time and
  double-time feels alternate. Odd meters are welcome (set meter to 3, 5 or 7).
  Bass: sine or FM bass, sparse, sometimes sliding; or an acid line treated as texture.
  Harmony: wistful and unusual: modal (dorian, lydian), added-note and suspended chords, slow pads against
  the busy drums; bell and music-box melodies with wide intervals.
  Arrangement: through-composed; sections differ in drum pattern and density more than in chords; breakdowns
  to melody alone.
  Mix: drums detailed and crisp but not loud; melodies soft and wide; plenty of dynamic range.
