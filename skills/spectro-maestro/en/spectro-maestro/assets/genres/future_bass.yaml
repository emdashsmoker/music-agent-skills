name: Future Bass
family: bass
summary: half-time trap drums under huge, pulsing supersaw chords and a bright, emotional drop melody
bpm: [140, 170, 150]
keys: [F major, C major, G major, A minor, D minor, E minor]
about: |
  Rhythm: half-time: kick on 1 and around the end of the bar, snare or clap on beat 3, trap hats with rolls.
  Bass: sub or 808 following the chord roots with long notes.
  Harmony: the drop is a wall of detuned saw chords, rich (seventh, ninth, added-note) and rhythmically
  pulsed: either re-struck in a syncopated pattern or held with a volume wobble. Progressions are bright:
  IV V vi, IV V iii vi, vi IV I V.
  Melody: the top note of the chords or a vocal chop carries a simple tune; verses are sparse with plucks and vocals.
  Arrangement: intro and verse soft, build with snare roll and riser, drop with the chords, second verse, bigger drop.
  Mix: chords very wide and ducked by kick and snare; sub mono; bright but not harsh.
profile:
  master: {lufs: -9.5}
  roles:
    chord: {duck: -6, level: -1.5, reverb: 0.25}
    bass: {duck: -3}
    snare: {level: -3.5, reverb: 0.18}
    pluck: {delay: 0.25, reverb: 0.3}
  returns: {reverb: {decay: 2.8}}
