extends: synthwave
name: Darksynth
summary: aggressive, horror-tinged synthwave; distorted bass, heavy drums, minor and phrygian riffs
bpm: [95, 135, 115]
keys: [D minor, E minor, C minor, E phrygian, D phrygian]
about: |
  Rhythm: hard kick (often four-on-the-floor or double-time patterns), cracking gated snare on 2 and 4, driving hats.
  Bass: distorted saw bass in sixteenths, palm-mute guitar feel; riffs with flat second and tritone.
  Harmony: dark minor, phrygian and harmonic minor; power chords, choirs, organ-like pads; chromatic movement.
  Melody: aggressive lead riffs, fast arpeggios, sudden stops and hits.
  Arrangement: cinematic intro, riff sections alternating with a half-time breakdown, big final section.
  Mix: loud and saturated compared with synthwave; bass and kick tight; lead cutting.
