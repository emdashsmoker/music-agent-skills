extends: house
name: Acid House
summary: a TB-303 line with slides and accents over 909 drums; the filter is the melody
bpm: [118, 128, 122]
keys: [A minor, C minor, E minor, G minor]
about: |
  Rhythm: 909 kick on every beat, clap on 2 and 4, off-beat open hat, sixteenth closed hats; raw and simple.
  Bass / lead: one 303 pattern of 16 steps repeats for the whole track. Its notes are few (root, octave, minor third,
  fifth, flat seventh); slides (~) and accents (!) and above all the slowly turning cutoff and resonance make the movement.
  Harmony: none or one chord; a pad or stab may mark the root.
  Arrangement: start with drums, bring the 303 in closed (dark), open the filter over 16-32 bars, drop the kick for a
  bar or eight, slam back. Two 303 lines can trade places.
  Mix: 303 in the middle and loud, kick punchy below it, little reverb, some delay on the 303.
profile:
  master: {lufs: -9.5}
  roles: {bass: {delay: 0.18, reverb: 0.06, duck: -5, hpf: 45, level: -2}}
