name: EBM
family: industrial
summary: electronic body music; hard sequenced sixteenth bass, martial four-on-the-floor drums, shouted vocals, little harmony
bpm: [110, 130, 120]
keys: [E minor, A minor, D minor, G minor, E phrygian]
about: |
  Rhythm: stiff and physical. Kick on every beat, snare on 2 and 4, sometimes a snare on every beat or marching
  patterns; closed hats in eighths or sixteenths; metallic percussion as accents.
  Bass: the hook. A one-bar sequence of sixteenths or eighths on one or two pitches (root, octave, minor third,
  flat seventh, flat second) from an FM or analog bass with a short filter envelope; no swing.
  Harmony: sparse. One root for long stretches, a second root for the chorus; cold string or choir pads, minor
  stabs, sampled noises.
  Vocals: shouted or commanding short phrases, often doubled.
  Arrangement: sequence alone, drums enter, verse and chorus differ by root note and added layers; breakdown
  with sequence and percussion only.
  Mix: bass sequence and kick dominate, dry and punchy, snare with a short room; mids left open for the voice.
