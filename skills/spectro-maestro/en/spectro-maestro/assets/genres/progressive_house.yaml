extends: house
name: Progressive House
summary: long evolving arrangement, plucks and pads, emotional chord progression, big breakdown
bpm: [122, 128, 126]
keys: [F minor, A minor, C minor, E minor, G minor]
about: |
  Rhythm: steady four-on-the-floor, off-beat hats, restrained percussion.
  Bass: sustained or off-beat bass following the chord roots, strongly sidechained.
  Harmony: four-chord minor progressions (i VI III VII, VI VII i i) carried by plucks, arps and wide pads.
  Arrangement: layers are added every 8-16 bars; a long breakdown exposes the chords and melody, then a build with
  filter opening and riser returns to the full groove.
  Mix: wide pads and plucks with reverb and delay, deep sidechain pump, clear low end.
profile:
  master: {lufs: -9.5}
  roles: {pad: {duck: -7}, pluck: {duck: -5}}
  returns: {reverb: {decay: 2.8}, delay: {time: 1/8d, feedback: 0.4}}
song:
  ending: hit
  swing: 0.0
  chords:
    main: "i | VI | III | VII"
    lift: "VI | VII | i | i"
  tracks:
    kick: {inst: kick_trance}
    bass: {inst: bass_offbeat, parts: {groove: {grid: ". . 1 - . . 1 - . . 1 - . . 1 -"}, simple: {grid: ". . 1 - . . 1 - . . 1 - . . 1 -"}}}
    chord: {inst: pluck_supersaw, role: pluck, parts: {stab: {grid: "c . . c . . c . . c . . c . c ."}, sparse: {grid: "c . . c . . c . . . . . . . . ."}}}
    pad: {inst: pad_supersaw}
    arp: {inst: arp_pulse, role: arp, parts: {up: {grid: "1 3 5 1' 5 3 1 3 5 1' 5 3 1' 5 3 1", octave: 4}}}
    lead: {inst: lead_saw, role: lead, parts: {hook: {line: "5:1.5 3:.5 5:1 1':1 | 7:1.5 5:.5 3:2 | 5:1.5 3:.5 5:1 2':1 | 1':2 7:1 5:1"}}}
  sections:
    - {name: intro, type: intro, bars: 16, chords: main, play: {kick: four, hat: off, shaker: run}}
    - {name: groove, type: verse, bars: 16, chords: main, hit: [crash], play: {kick: four, clap: two, hat: sixteen, ohat: off, bass: simple, chord: sparse}, auto: {chord: {lpf: [500, 5000]}}}
    - {name: full, type: chorus, bars: 16, chords: main, hit: [crash], play: {kick: four, clap: two, hat: sixteen, ohat: off, shaker: run, bass: groove, chord: stab, arp: up}}
    - {name: break, type: break, bars: 16, chords: main, hit: [downlifter], play: {pad: hold, chord: sparse, lead: hook}, auto: {pad: {lpf: [500, 9000]}}}
    - {name: build, type: build, bars: 8, chords: main, rise: {riser: 8, snare_roll: 8}, play: {hat: off, pad: hold, chord: stab, arp: up, lead: hook}, auto: {chord: {lpf: [600, 14000]}}}
    - {name: drop, type: drop, bars: 32, chords: main, hit: [impact, crash], play: {kick: four, clap: two, hat: sixteen, ohat: off, shaker: run, bass: groove, chord: stab, pad: hold, arp: up, lead: hook}}
    - {name: outro, type: outro, bars: 16, chords: main, hit: [crash], play: {kick: four, hat: off, shaker: run, bass: simple}}
