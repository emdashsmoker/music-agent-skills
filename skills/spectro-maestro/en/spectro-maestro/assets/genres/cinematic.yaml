name: Cinematic (hybrid orchestral)
family: orchestral
summary: trailer-style hybrid; string ostinatos, brass swells, big drums and synth pulses building to a climax
bpm: [80, 140, 110]
keys: [D minor, C minor, E minor, A minor, G minor]
about: |
  Rhythm: low, wide drums (timpani, toms, big hits) in simple powerful patterns; a ticking pulse or sixteenth
  string ostinato drives the time; electronic kick and impacts reinforce the downbeats.
  Bass: low strings or a sub drone on the root; synth pulse in eighths.
  Harmony: minor, slow, heroic: i VI III VII, i VI iv V, i III VII iv; one chord per bar or two; a rising top
  line through the progression. Brass holds the chords, strings repeat a short figure.
  Melody: broad, few notes, in horns or high strings; stated quietly, then with full forces.
  Arrangement: three acts: quiet intro (pad, piano, pulse), build with ostinato and drums, full climax with
  brass and choir; a sudden stop and a soft tail are typical.
  Note: the orchestral voices here are synthesised imitations (ensemble strings, synth brass, timpani), suited
  to hybrid scoring, not to a realistic solo orchestra.
  Mix: big hall reverb, drums wide and deep, low end powerful but not constant; wide dynamic range.
