extends: synthpop
name: Futurepop
summary: melancholic synthpop with trance energy; four-on-the-floor, sequenced bass, supersaw and pluck hooks, anthemic chorus
bpm: [122, 136, 128]
keys: [A minor, D minor, E minor, F# minor, C minor]
about: |
  Rhythm: kick on every beat, snare or clap on 2 and 4, off-beat open hat and sixteenth hats; EBM heritage, club tempo.
  Bass: sequenced sixteenth or eighth FM/analog bass on the chord root with octave jumps; in choruses an off-beat
  trance bass. Tight and dry.
  Harmony: minor, emotional four-chord progressions held for the whole section: i VI III VII, VI VII i i,
  i iv VI V. Bright leads and trance plucks over dark chords give the bittersweet character.
  Melody: clean male or female vocal with a singable chorus; a supersaw or pluck hook answers the vocal and
  carries the instrumental chorus. Arpeggios run through the verses.
  With a vocal, take its rhythm from the spoken stress of the words (references/vocals.md) and let the lead follow or answer it.
  Arrangement: intro with arpeggio and kick, verse (sparse), pre-chorus lift, chorus (full, wide), second verse,
  chorus, breakdown or bridge with pads and vocal, final double chorus, outro.
  Mix: vocal clear and upfront with plate reverb and eighth delay; sidechain pump on pads and plucks; kick and
  bass tight; loudness between synthpop and trance.
