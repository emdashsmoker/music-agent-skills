extends: synthwave
name: Italo Disco
summary: 1980s European dance pop; octave bass in sixteenths, claps, bright arpeggios and a simple catchy melody
bpm: [110, 128, 120]
keys: [A minor, D minor, E minor, G minor]
about: |
  Rhythm: four-on-the-floor kick, clap on 2 and 4, open hat on the off-beats, cowbell or tom fills.
  Bass: the signature rolling octave bass: root low, root high in sixteenths or eighths, mechanical and constant.
  Harmony: simple minor progressions (i VI VII i, i iv VII III), string machine pads, bright arpeggios.
  Melody: naive, catchy, played by a square or bell lead; a vocoder or accented vocal is typical.
  With a vocal, take its rhythm from the spoken stress of the words (references/vocals.md) and let the lead follow or answer it.
  Arrangement: long instrumental intro, verse and chorus, instrumental break with the melody, extended outro.
  Mix: dry and bright drums, bass upfront, moderate loudness.
profile:
  master: {lufs: -10.5}
song:
  ending: hit
  chords:
    verse: "i | i | VI | VII"
    chorus: "i | VI | VII | III"
    bridge: "iv | VII | III | VI"
