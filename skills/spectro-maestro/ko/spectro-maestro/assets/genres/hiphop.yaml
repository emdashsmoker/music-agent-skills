name: Hip Hop (boom bap)
family: hiphop
summary: 85-95 bpm swung kick and snare, a sampled-feel chord loop and a round bass line
bpm: [82, 98, 90]
keys: [A minor, D minor, E minor, G minor, C minor]
about: |
  Rhythm: kick on 1 and syncopated around beat 3, snare on 2 and 4, swung eighth or sixteenth hats (swing 0.15-0.25);
  laid back, the snare slightly late is fine.
  Bass: round and simple, follows the kick, root and fifth with passing notes.
  Harmony: a 2- or 4-bar loop of seventh chords on electric piano, piano or a filtered pad, like a chopped sample.
  Arrangement: intro, 16-bar verses with elements dropping in and out, 8-bar hooks with an added melody.
  Mix: drums punchy and dry in front, lows warm, highs soft, moderate loudness; leave the centre free for a vocal.
