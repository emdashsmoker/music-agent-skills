name: Synthpop
family: pop
summary: song-based electronic pop; drum machine, sequenced bass, bright synth hooks, verse and chorus
bpm: [105, 130, 118]
keys: [A minor, C major, D minor, E minor, G major, F major]
about: |
  Rhythm: drum machine with kick on 1 and 3 (or every beat), snare on 2 and 4 with a short or gated reverb,
  eighth or sixteenth hats; fills at section ends.
  Bass: sequenced eighths or sixteenths on the chord root with octave jumps, or a simple held synth bass.
  Harmony: clear pop progressions, four chords per phrase: I V vi IV, vi IV I V, i VI III VII, i iv VI V.
  Melody: a memorable chorus hook on a lead synth doubles or answers the vocal; arpeggios fill the verses.
  With a vocal, take its rhythm from the spoken stress of the words (references/vocals.md) and let the lead follow or answer it.
  Arrangement: intro, verse, pre-chorus, chorus, verse, chorus, bridge, final chorus (often with added layers
  or a key lift), outro. 3-4 minutes.
  Mix: vocal first, then snare and bass; pads wide; moderate loudness.
profile:
  master: {lufs: -10.5}
  roles:
    bass: {duck: -3}
    pad: {duck: -2}
    snare: {reverb: 0.16}
    lead: {duck: 0}
  returns: {reverb: {decay: 2.0}, delay: {time: 1/8, feedback: 0.3}}
song:
  ending: hit
  seed: 101
  chords:
    verse: "i | VI | III | VII"
    chorus: "VI | VII | i | i | VI | VII | III | VII"
    bridge: "iv | iv | VI | VII"
  tracks:
    kick: {inst: kick_linn, role: kick, parts: {four: {hits: "x...x...x...x..."}, half: {hits: "x.......x......."}}}
    snare: {inst: snare_linn, role: snare, parts: {two: {hits: "....x.......x..."}, fill: {hits: "....x.......x...|....x.......x.xx"}}}
    clap: {inst: clap_909, role: snare, parts: {two: {hits: "....x.......x..."}}, mix: {gain_db: -5}}
    hat: {inst: hat_closed_808, role: hat, parts: {eight: {hits: "x.x.x.x.x.x.x.x.", vel: 0.8}, sixteen: {hits: "x.oxx.oxx.oxx.ox", vel: 0.8}}}
    ohat: {inst: hat_open_808, role: hat, parts: {off: {hits: "..x...x...x...x."}}, mix: {gain_db: -3}}
    bass: {inst: bass_moog, role: bass, parts: {eight: {grid: "1 . 1 . 1 . 1 . 1 . 1 . 1 . 1' ."}, oct: {grid: "1 . 1' . 1 . 1' . 1 . 1' . 1 . 1' 1"}}}
    arp: {inst: arp_pulse, role: arp, octave: 4, parts: {up: {grid: "1 5 1' 5 3' 5 1' 5 1 5 1' 5 3' 5 1' 5"}}}
    pad: {inst: pad_pwm, role: pad, parts: {hold: {grid: "c - - - - - - - - - - - - - - -"}}}
    stab: {inst: brass_synth, role: chord, parts: {hits: {grid: "c - - . . . c - . . . . c - - ."}}}
    lead:
      inst: lead_square
      role: lead
      parts:
        hook: {line: "1':1 7:.5 1':.5 5:2 | 2':1 1':.5 2':.5 7:2 | 1':1 7:.5 1':.5 5:1 3:1 | r:4 | 1':1 7:.5 1':.5 5:2 | 2':1 1':.5 2':.5 7:2 | 3':1 2':.5 1':.5 7:1 5:1 | 7:3 r:1"}
  sections:
    - {name: intro, type: intro, bars: 8, chords: verse, play: {kick: four, hat: eight, bass: eight, arp: up}, auto: {arp: {lpf: [600, 8000]}}}
    - {name: verse1, type: verse, bars: 16, chords: verse, play: {kick: four, snare: two, hat: eight, bass: eight, arp: up}}
    - {name: pre1, type: prechorus, bars: 4, chords: bridge, play: {kick: half, snare: two, hat: sixteen, bass: eight, pad: hold}, rise: {riser: 2}}
    - {name: chorus1, type: chorus, bars: 16, chords: chorus, hit: [crash], play: {kick: four, snare: fill, clap: two, hat: sixteen, ohat: off, bass: oct, pad: hold, stab: hits, lead: hook}}
    - {name: verse2, type: verse, bars: 16, chords: verse, play: {kick: four, snare: two, hat: eight, bass: eight, arp: up, pad: hold}}
    - {name: pre2, type: prechorus, bars: 4, chords: bridge, play: {kick: half, snare: two, hat: sixteen, bass: eight, pad: hold}, rise: {riser: 2}}
    - {name: chorus2, type: chorus, bars: 16, chords: chorus, hit: [crash], play: {kick: four, snare: fill, clap: two, hat: sixteen, ohat: off, bass: oct, pad: hold, stab: hits, lead: hook}}
    - {name: bridge, type: bridge, bars: 8, chords: bridge, hit: [downlifter], play: {pad: hold, arp: up, hat: eight}, rise: {riser: 4, snare_roll: 2}}
    - {name: chorus3, type: chorus, bars: 16, chords: chorus, hit: [impact, crash], play: {kick: four, snare: fill, clap: two, hat: sixteen, ohat: off, bass: oct, pad: hold, stab: hits, lead: hook, arp: up}}
    - {name: outro, type: outro, bars: 8, chords: verse, play: {kick: four, hat: eight, bass: eight, arp: up}, auto: {master: {lpf: [20000, 1500]}}}
