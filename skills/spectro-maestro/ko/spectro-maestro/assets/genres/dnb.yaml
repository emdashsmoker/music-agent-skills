name: Drum and Bass
family: breakbeat
summary: 174 bpm two-step breakbeat, deep sub or reese bass, pads and stabs at half the drum speed
bpm: [165, 178, 174]
keys: [F minor, E minor, G minor, A minor, D minor]
about: |
  Rhythm: the two-step: kick on beat 1 and on the 'and' of 3, snare on 2 and 4, fast hats and ghost snares between.
  The drums feel fast, the harmony moves at half speed (think 87 bpm).
  Bass: sub bass on long notes following the roots, or a mid-range reese (detuned saws, moving filter) riff; the
  bass riff is the hook and answers the drums.
  Harmony: minor, sparse; pads and stabs in 2- or 4-bar changes (i VI, i v VI iv).
  Arrangement: 16-32 bar intro without the full break, build with riser, drop with drums and bass, 16-bar
  breakdown in the middle, second drop with variation, outro. Sections are 16 or 32 bars.
  Mix: snare loud and cracking around 200 Hz and 2-5 kHz; sub mono and clean below 100 Hz; kick short.
profile:
  master: {lufs: -8.5}
  roles:
    snare: {level: -3.5}
    kick: {level: -4.5}
    bass: {duck: -4, level: -2}
    sub: {duck: -5, level: -3.5}
    pad: {duck: -2}
  returns: {reverb: {decay: 2.6}}
song:
  ending: hit
  seed: 51
  chords:
    main: "i | i | VI | VI | iv | iv | v | v"
    alt: "i | i | VI | VI | iv | iv | v | v"
  tracks:
    kick: {inst: kick_dnb, role: kick, parts: {two: {hits: "x.........x....."}, roll: {hits: "x.....x...x....."}}}
    snare: {inst: snare_dnb, role: snare, parts: {two: {hits: "....x.......x..."}, ghost: {hits: "....x..o.o..x..o"}}}
    hat: {inst: hat_closed_909, role: hat, parts: {eight: {hits: "x.x.x.x.x.x.x.x.", vel: 0.7}, shuffle: {hits: "x.xxx.x.x.xxx.xo", vel: 0.75}}}
    ride: {inst: ride_909, role: hat, parts: {eight: {hits: "x.x.x.x.x.x.x.x.", vel: 0.6}}, mix: {gain_db: -4}}
    shaker: {inst: shaker, role: perc, parts: {run: {hits: "xxoxxxoxxxoxxxox", vel: 0.6}}}
    sub: {inst: bass_sub, role: sub, parts: {long: {grid: "1 - - - - - - - - - 1 - - - - -"}, riff: {grid: "1 - - - - - 1 - - . 5 - - - 1' -"}}}
    reese: {inst: bass_reese, role: bass, octave: 2, parts: {riff: {grid: "1 - - - - - - . 1 - b3 - 1 - b7, -"}}, mix: {hpf: 90}}
    pad: {inst: pad_warm, role: pad, parts: {hold: {grid: "c - - - - - - - - - - - - - - -"}}}
    stab: {inst: chord_stab, role: chord, parts: {hit: {grid: ". . . . . . c . . . . . . . . ."}}}
    lead: {inst: lead_fm_bell, role: pluck, parts: {motif: {line: "5:1.5 3:1.5 1:1 | r:4 | 5:1.5 3:1.5 1:1 | r:4 | 4:1.5 3:1.5 1:1 | r:4 | 5:1.5 2:1.5 7,:1 | r:4"}}}
  sections:
    - {name: intro, type: intro, bars: 16, chords: main, play: {pad: hold, hat: eight, lead: motif}, auto: {pad: {lpf: [400, 6000]}}}
    - {name: build, type: build, bars: 8, chords: main, rise: {riser: 8, snare_roll: 4}, play: {pad: hold, hat: shuffle, kick: two, lead: motif}}
    - {name: drop, type: drop, bars: 32, chords: main, hit: [impact, crash], play: {kick: two, snare: ghost, hat: shuffle, shaker: run, sub: riff, reese: riff, stab: hit}}
    - {name: breakdown, type: break, bars: 16, chords: alt, hit: [downlifter], play: {pad: hold, lead: motif, hat: eight}, rise: {riser: 4}}
    - {name: drop2, type: drop, bars: 32, chords: main, hit: [impact, crash], play: {kick: roll, snare: ghost, hat: shuffle, ride: eight, shaker: run, sub: riff, reese: riff, stab: hit, pad: hold, lead: motif}}
    - {name: outro, type: outro, bars: 16, chords: main, hit: [crash], play: {kick: two, snare: two, hat: eight, sub: long}, gap: {kick: 16, snare: 16}}
