extends: trance
name: Uplifting Trance
summary: 138 bpm, rolling bass, long emotional breakdown, soaring supersaw anthem at the climax
bpm: [136, 140, 138]
keys: [A minor, F# minor, B minor, E minor, G minor]
about: |
  Rhythm: tight kick on every beat, off-beat open hat, clap on 2 and 4, shaker or sixteenth hats; ride in the climax.
  Bass: rolling sixteenth bass that skips the kick's sixteenth (. x x x) on the chord root, mid-bass above a sub.
  Harmony: bright minor progressions with a lift: i VI III VII, VI VII i i, VI VII v i, iv VI III VII; one chord
  per bar in the groove, held chords in the breakdown. Suspended and added-ninth chords add shimmer.
  Melody: long-breathed, stepwise with one or two hopeful leaps upward (a fifth or sixth), resolving on the tonic
  or the fifth; stated first softly (piano, pluck, strings) in the breakdown, then by the supersaw lead at full power.
  Arrangement (7-10 min): intro 32 bars drums and bass; first groove with arps and plucks; breakdown 32-48 bars
  with pads, piano or strings and the full melody; 16-bar build with snare roll, riser and filter opening; climax
  32-64 bars; short second break or strip-down; outro 32 bars.
  Mix: very wide and wet. Long hall reverb and dotted-eighth delay on lead and plucks, strong sidechain pump,
  low end mono. The lead sits above everything in the climax.
